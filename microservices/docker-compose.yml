services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - product-service
      - order-service

  user-service:
    build: ./user-service
    environment:
      MONGO_URI: mongodb://mongo:27017/users
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    depends_on:
      - mongo

  product-service:
    build: ./product-service
    environment:
      MONGO_URI: mongodb://mongo:27017/products
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    depends_on:
      - mongo

  order-service:
    build: ./order-service
    environment:
      MONGO_URI: mongodb://mongo:27017/orders
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    depends_on:
      - mongo

volumes:
  mongo-data:
